<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur CSRF</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

    <div class="container text-center">
        <div class="card shadow-lg p-4 border-0">
            <div class="card-body">
                <h1 class="text-danger"><i class="bi bi-shield-lock"></i> Erreur de Sécurité</h1>
                <p class="lead">Votre requête a été bloquée car le token CSRF est invalide ou absent.</p>
                <p class="text-muted">Essayez de <strong>recharger la page</strong> et de réessayer.</p>
                <a href="/" class="btn btn-primary mt-3">Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons (optionnel) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
