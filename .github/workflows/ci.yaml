name: CI

on:
  push:
    branches:
      - philippe
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PDM and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdm
          pdm cache clear  # Supprime le cache (sans -y, option non supportée)
          pdm install

      - name: Run linters
        run: pdm run lint

  security_scan:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PDM and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdm
          pdm cache clear
          pdm install

      - name: Start Flask application and wait for it to be accessible
        run: |
          # (Adaptez éventuellement les variables d'environnement nécessaires, ex. SECRET_KEY)
          pdm run flask run --host=0.0.0.0 --port=5000 > flask.log 2>&1 &
          echo "Attente du démarrage de l'application Flask..."
          for i in {1..30}; do
            if curl -s http://localhost:5000 > /dev/null; then
              echo "Application Flask accessible !"
              exit 0
            fi
            echo "Attente... ($i/30)"
            sleep 1
          done
          echo "Erreur : L'application Flask n'est pas accessible après 30 secondes."
          exit 1

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: "http://localhost:5000"
          fail_action: false  # Changez en true pour faire échouer le job en cas de vulnérabilités critiques
          cmd_options: "-a -J report.json -r report.html"

      - name: Show ZAP scan results
        run: cat report.json || echo "ZAP scan report unavailable"

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: ZAP Security Report
          path: report.html
