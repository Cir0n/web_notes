name: CI

on:
  push:
    branches:
      - philippe
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install PDM
        run: |
          python -m pip install pdm
          pdm install

      - name: Run linters
        run: pdm run lint

  security_scan:
    runs-on: ubuntu-latest
    needs: lint  # Exécute ce job après le lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install pdm
          pdm install

      - name: Start Flask application
        run: |
          pdm run flask run --host=0.0.0.0 --port=5000 &
          sleep 10  # Attendre que le serveur démarre

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: "http://localhost:5000"
          fail_action: false  # Passe à true si tu veux bloquer le CI en cas de vulnérabilités
          docker: false
          rules_file_name: ".zap-rules.tsv"

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: ZAP Security Report
          path: report.html
